<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f8fb"/><stop offset="1" stop-color="#e3e8f2"/></linearGradient>
    <pattern id="dots" width="52" height="52" patternUnits="userSpaceOnUse"><circle cx="26" cy="26" r="3.2" fill="#8a97b3" opacity="0.35"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b2640" flood-opacity="0.22"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" fill="url(#dots)"/></g>
  <!-- the G: one curved connector from the top card round to the sticky note -->
  <path d="M 676 352 A 240 240 0 1 0 752 580 V 540 H 600" fill="none" stroke="#2f6feb" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#card)">
    <rect x="600" y="248" width="196" height="136" rx="26" fill="#fff" stroke="#2f6feb" stroke-width="12"/>
    <rect x="236" y="444" width="140" height="136" rx="26" fill="#fff" stroke="#1fa888" stroke-width="12"/>
    <rect x="470" y="470" width="140" height="140" rx="10" fill="#ffd27a" transform="rotate(-6 540 540)"/>
  </g>
  <g fill="#b9c4dc"><rect x="634" y="292" width="128" height="18" rx="9"/><rect x="634" y="326" width="84" height="18" rx="9"/>
    <rect x="268" y="490" width="76" height="18" rx="9"/><rect x="268" y="524" width="52" height="18" rx="9"/></g>
  <g fill="#c98a1f" opacity="0.55" transform="rotate(-6 540 540)"><rect x="494" y="514" width="92" height="16" rx="8"/><rect x="494" y="546" width="64" height="16" rx="8"/></g>
</svg>
