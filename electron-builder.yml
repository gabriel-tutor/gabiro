# Packages Gabiro.app: `npm run app:mac` (macOS only). Ad-hoc signed, not notarized; see README → Mac app.
appId: dev.gabiro.app
productName: Gabiro
directories:
  output: release
files:
  - package.json
  - dist/**
  - desktop/dist/**
  - desktop/start.html
  - desktop/start.css
  - desktop/start.js
  - desktop/preload.cjs
  - desktop/build/icon.svg
  - desktop/build/icon.png
# bin/gabiro runs the app binary as Node (ELECTRON_RUN_AS_NODE): keep Electron's RunAsNode fuse enabled (the default).
extraResources:
  - from: desktop/bin/gabiro
    to: bin/gabiro
protocols:
  - name: Gabiro
    schemes: [gabiro]
mac:
  category: public.app-category.developer-tools
  # Rendered from desktop/build/icon.svg by `npm run icon`; electron-builder converts it to .icns.
  icon: desktop/build/icon.png
  # Ad-hoc signature: without one, Apple Silicon reports a downloaded app as "damaged".
  identity: "-"
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
publish: null
